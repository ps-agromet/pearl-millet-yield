# Conda environment that reproduces the published results.
# Versions are pinned: aquacrop 2.2.3 is required (3.x renamed outputs and
# changed the Crop class, so notebook 02 fails on it).
#   conda env create -f environment.yml
#   conda activate pm-aquacrop
name: pm-aquacrop
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.21.6
  - pandas=1.3.5
  - numba=0.56.4
  - setuptools<60        # aquacrop 2.2.3 compiles its modules via numpy.distutils on first import
                         # (needs a C compiler; see README if you have none)
  - geopandas=0.13.2
  - fiona<1.10
  - shapely<2.1
  - rasterio=1.3
  - matplotlib<3.8
  - seaborn=0.12
  - scipy<1.11
  - openpyxl
  - xlrd
  - tqdm
  - jupyterlab
  - pip
  - pip:
      - aquacrop==2.2.3
      - eto==1.1.2
